<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Color Pile</title>
    <link rel="stylesheet" href="../../shared/css/core.css">
    <link rel="stylesheet" href="../../shared/css/dev-overlay.css">
    <link rel="stylesheet" href="../../shared/css/mobile.css">
    <link rel="stylesheet" href="style.css">
    <style>
        #debug-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 9999;
            pointer-events: none;
            color: #22c55e;
            font-size: 12px;
            border: 1px solid #22c55e;
        }
    </style>
</head>

<body>
    <div id="debug-info" style="display: none;">Click board to focus | Zoom: 1.0</div>
    <div id="center-dot"></div>
    <input type="color" id="pile-color-picker"
        style="position: fixed; opacity: 0; pointer-events: none; width: 0; height: 0; left: 0; top: 0;"
        autocomplete="off">
    <div id="game-container">
        <div class="sb-turn"></div>
    </div>
    <script src="../../shared/mobile/viewport-mode.js"></script>
    <script src="../../shared/games/registry.js"></script>
    <script src="../../shared/js/hub/protocol.js"></script>
    <script src="../../shared/platform/game-adapter.js"></script>
    <script src="../../shared/platform/mobile-layout.js"></script>
    <script src="../../shared/platform/dev-overlay.js"></script>
    <script src="../../shared/platform/zoom.js"></script>
    <script src="../../shared/platform/viewport.js"></script>
    <script src="../../shared/platform/drag.js"></script>
    <script src="../../shared/platform/game-sync.js"></script>
    <script src="../../shared/platform/engine.js?v=16"></script>
    <script src="../../shared/platform/logic.js"></script>
    <script src="piles.js?v=1.3.6"></script>
</body>

</html>
