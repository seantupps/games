<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
        (function () {
            try {
                var h = location.hostname;
                var lan = /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
                var ngrok = /\.(ngrok-free\.app|ngrok\.io|ngrok\.app)$/i.test(h);
                if ((!lan && !ngrok) || location.search.indexOf('firebase=') >= 0) return;
                var u = new URL(location.href);
                u.searchParams.set('firebase', 'emulator');
                if (!u.searchParams.get('room')) u.searchParams.set('room', 'lobby');
                if (ngrok && !u.searchParams.get('rtdbUrl')) {
                    u.searchParams.set('rtdbUrl', u.origin + '?ns=games-fad3a-default-rtdb');
                }
                location.replace(u.href);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Game Hub - Project Five (Shared Root)</title>
    <script src="shared/dev/phone-debug-relay.js"></script>
    <script src="shared/mobile/viewport-mode.js"></script>
    <script src="shared/mobile/mobile-hub.js"></script>
    <script src="shared/mobile/mobile-settings-swipe.js"></script>
    <script src="shared/mobile/mobile-hub-keyboard.js"></script>
    <link rel="stylesheet" href="shared/css/core.css">
    <link rel="stylesheet" href="shared/css/mobile.css">
    <style>
        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        #game-hub-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Sidebar Styles - Moved to RIGHT */
        #settings-sidebar {
            position: fixed;
            right: -350px;
            /* Hidden off-right */
            top: 0;
            width: 320px;
            /* Reduced from 400px */

            height: 100%;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 11000;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 50px;
            /* More padding */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 40px;
            /* Larger gap */
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.5);
        }

        #settings-sidebar.open {
            right: 0;
        }


        .sidebar-title {
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            display: none;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.3);
            display: none;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            color: white;
            border-radius: 8px;
            font-size: 1.2rem;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--theme-color);
        }

        .toggle-group {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Player List Styles */
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .player-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .player-status {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .player-name {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            flex: 1;
        }

        .player-badge {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--theme-color);
            background: rgba(var(--theme-color-rgb), 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .player-item.active {
            border-color: var(--theme-color);
            background: rgba(var(--theme-color-rgb), 0.05);
        }

        .game-btn {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .game-btn:hover,
        .game-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--theme-color);
            color: white;
        }

        /* Settings Icon - Moved to BOTTOM RIGHT */
        #settings-trigger {
            position: fixed;
            bottom: 24px;
            right: 24px;
            /* Move to right */
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9000;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.4);
            background: transparent !important;
            /* No background circle */
        }


        #settings-sidebar.open~#settings-trigger {
            opacity: 0;
            pointer-events: none;
        }

        #settings-trigger:hover {
            color: white;
            transform: rotate(45deg);
        }

        .keybind-list {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 8px;
        }

        .key-tag {
            color: var(--theme-color);
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
        }

        #color-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-opt {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-opt.active {
            border-color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #hub-loading {
            position: fixed;
            inset: 0;
            z-index: 50000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0a0a0a;
            color: rgba(255, 255, 255, 0.85);
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }

        #hub-loading.hidden {
            display: none;
        }

        #hub-loading .hub-loading-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #hub-loading .hub-loading-hint {
            font-size: 0.85rem;
            opacity: 0.6;
            max-width: 280px;
            line-height: 1.4;
        }
    </style>
</head>


<body>
    <div id="phone-boot-status" style="position:fixed;inset:0 auto auto 0;right:0;z-index:60000;padding:10px 12px;background:#1e3a5f;color:#fff;font:600 12px system-ui,sans-serif;text-align:center;">
        Loading hub…
    </div>
    <div id="hub-loading" aria-live="polite">
        <div class="hub-loading-title">Loading game hub…</div>
        <div class="hub-loading-hint">First visit loads Firebase from the internet, then talks to your PC on Wi‑Fi.</div>
    </div>
    <div id="settings-trigger" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 10-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
        </svg>
    </div>

    <div id="game-hub-container">
        <iframe id="game-frame" src="games/piles/index.html"></iframe>
        <!-- Captures left-edge swipes; iframe otherwise eats touches on the game area -->
        <div id="mobile-settings-edge" data-testid="mobile-settings-edge" aria-hidden="true"></div>

        <div id="global-turn-indicator">
            <div class="dot"></div>
            <span id="turn-text">Your Turn</span>
        </div>

        <div id="global-win-banner"></div>

        <div id="mobile-bar" aria-label="Mobile shortcuts">
            <button type="button" class="mobile-bar-btn" id="mobile-chat-btn" title="Chat" aria-label="Chat">💬</button>
            <button type="button" class="mobile-bar-btn" id="mobile-fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/></svg>
            </button>
            <button type="button" class="mobile-bar-btn" id="mobile-settings-btn" title="Settings" aria-label="Settings">⚙</button>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div id="chat-input-wrapper">
                <input type="text" id="chat-input" name="five-game-chat" placeholder="Type /p <name> to party..."
                    spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
                    inputmode="text" enterkeyhint="send" data-lpignore="true" data-1p-ignore
                    data-form-type="other">
            </div>
        </div>

        <div id="settings-sidebar">
            <div class="setting-group">
                <input type="text" id="username-input" placeholder="Guest" spellcheck="false" maxlength="16">
            </div>

            <div class="setting-group">
                <input type="color" id="theme-color-input" value="#3b82f6" oninput="setUserColor(this.value)"
                    style="width: 100%; height: 48px; border: none; background: transparent; cursor: pointer; border-radius: 8px;">
            </div>

            <div class="setting-group">
                <div class="player-list" id="player-list"></div>
            </div>

            <div class="setting-group" id="game-picker-host"></div>

            <div class="setting-group" id="mode-settings-group">
                <div class="toggle-group" id="mode-picker-host"></div>
            </div>

            <div class="setting-group">
                <button class="game-btn" id="btn-leave-party" type="button" onclick="leaveParty()"
                    style="display: none; border-color: rgba(239, 68, 68, 0.5); color: #fca5a5;">Leave party</button>
            </div>

            <div class="setting-group">
                <div class="keybind-list">
                    <span class="key-tag">S</span> <span>Settings</span>
                    <span class="key-tag">T</span> <span>Chat</span>
                    <span class="key-tag" id="keybind-mode-tag">M</span> <span id="keybind-mode-desc">Next Mode</span>
                    <span class="key-tag">G</span> <span>Change Game</span>
                    <span class="key-tag">F6</span> <span>Dev Info</span>
                    <span class="key-tag">Scroll</span> <span>Zoom</span>
                </div>
            </div>
        </div>

        <div id="invite-toast">
            <div class="toast-content">
                <div class="toast-text">
                    <span id="toast-sender">Someone</span> invited you to <span id="toast-game-name">Games</span>
                </div>
            </div>
            <div class="toast-actions">
                <button id="btn-accept-invite">Accept</button>
                <button onclick="hideInviteToast()">Dismiss</button>
            </div>
        </div>
    </div>

    <script>
        var hubBootDismissed = false;
        function setBootStatus(msg, ok) {
            var bar = document.getElementById('phone-boot-status');
            if (!bar) return;
            if (hubBootDismissed && ok !== false) return;
            bar.textContent = msg;
            bar.style.background = ok ? '#14532d' : (ok === false ? '#7f1d1d' : '#1e3a5f');
            if (ok === false) bar.style.display = '';
        }
    </script>
    <script src="vendor/firebase/firebase-app-compat.js"
        onerror="this.onerror=null;this.src='https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js'"></script>
    <script src="vendor/firebase/firebase-database-compat.js"
        onerror="this.onerror=null;this.src='https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js'"></script>
    <script>
        if (typeof firebase === 'undefined') {
            setBootStatus('Firebase SDK failed to load', false);
            var el = document.getElementById('hub-loading');
            if (el) {
                el.querySelector('.hub-loading-title').textContent = 'Cannot load Firebase SDK';
                el.querySelector('.hub-loading-hint').textContent =
                    'Open phone-check.html first. On PC: npm run vendor:firebase';
            }
            if (window.FivePhoneDebug) window.FivePhoneDebug.flush('firebase-missing');
        } else {
            setBootStatus('Firebase loaded, starting network…');
        }
    </script>
    <script src="shared/js/device-storage.js"></script>
    <script src="shared/network/firebase-env.js"></script>
    <script src="shared/network/network.js"></script>
    <script src="shared/network/rtdb-schema.js"></script>
    <script src="shared/games/registry.js"></script>
    <script src="shared/js/hub/protocol.js"></script>
    <script src="shared/js/hub/boot.js"></script>
    <script src="shared/js/hub/theme.js"></script>
    <script src="shared/js/hub/ui.js"></script>
    <script src="shared/js/hub/chat.js"></script>
    <script src="shared/js/hub/room.js"></script>
    <script src="shared/js/hub/invites.js"></script>
    <script src="shared/js/hub/bridge-handlers.js"></script>
    <script src="shared/js/hub/games-controller.js"></script>
    <script src="shared/js/hub/game-picker-ui.js"></script>
    <script src="shared/js/hub/message-bridge.js"></script>
    <script src="shared/js/hub/app.js"></script>

    <script>
        HubApp.bootstrap();
    </script>

</body>

</html>
